appId: com.capybara.lulu
productName: 水豚噜噜
directories:
  output: dist
  buildResources: resources

# ============================================================
# Windows 配置
# ============================================================
win:
  target:
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
  legalTrademarks: Capybara Lulu
  publisherName: Capybara Lulu
  requestedExecutionLevel: asInvoker

portable:
  artifactName: 水豚噜噜.exe

# ============================================================
# macOS 配置
# 使用 zip 格式避免 macOS Tahoe 上 hdiutil/DMG 构建器的 bug
# (electron-builder v25.x 的 DMG 构建在 macOS 26/Darwin 25.x 上 hdiutil detach 失败)
# zip 包含 .app 应用包，用户解压后拖入 Applications 即可使用
# ============================================================
mac:
  target:
    - target: zip
      arch: [x64, arm64]
  icon: resources/icon-mac.png
  category: public.app-category.entertainment
  hardenedRuntime: false
  gatekeeperAssess: false

# ============================================================
# 通用配置
# ============================================================
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**

compression: normal
removePackageScripts: true
removePackageKeywords: true
